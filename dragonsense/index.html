<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Sense</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
height:100vh;
overflow:hidden;
background:#000;
color:white;
}

.app{
position:relative;
width:100%;
height:100vh;
background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop') center center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(1px);
}

.top{
position:relative;
z-index:2;
padding:30px 25px;
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.logo{
font-size:52px;
letter-spacing:10px;
font-weight:200;
margin-top:60px;
text-align:center;
width:100%;
}

.sub{
text-align:center;
opacity:0.7;
letter-spacing:4px;
margin-top:10px;
font-size:14px;
}

.center{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
margin-top:-60px;
}

.signal{
width:240px;
height:240px;
border-radius:50%;
border:1px solid rgba(255,255,255,0.1);
display:flex;
justify-content:center;
align-items:center;
position:relative;
animation:pulse 2s infinite;
}

.signal::before,
.signal::after{
content:'';
position:absolute;
border-radius:50%;
border:1px solid rgba(255,255,255,0.08);
}

.signal::before{
width:170px;
height:170px;
}

.signal::after{
width:90px;
height:90px;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.status{
letter-spacing:4px;
font-size:13px;
opacity:0.7;
}

.message{
font-size:28px;
letter-spacing:3px;
text-align:center;
padding:0 30px;
}

.small{
opacity:0.7;
font-size:14px;
letter-spacing:2px;
}

.btn{
margin-top:20px;
padding:22px 60px;
border:1px solid rgba(255,255,255,0.25);
background:rgba(0,0,0,0.4);
color:white;
font-size:22px;
letter-spacing:5px;
border-radius:16px;
backdrop-filter:blur(6px);
cursor:pointer;
transition:0.3s;
}

.btn:active{
transform:scale(0.95);
}

.bottom{
position:relative;
z-index:2;
display:grid;
grid-template-columns:repeat(4,1fr);
border-top:1px solid rgba(255,255,255,0.08);
background:rgba(0,0,0,0.55);
}

.nav{
padding:18px 10px;
text-align:center;
font-size:12px;
letter-spacing:2px;
opacity:0.7;
}

.reveal{
position:fixed;
inset:0;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
animation:fadein 1s;
}

@keyframes fadein{
from{opacity:0;}
to{opacity:1;}
}

.dragon{
font-size:40px;
margin-bottom:20px;
}

.rarity{
font-size:20px;
letter-spacing:4px;
margin-bottom:20px;
color:gold;
}

.scan{
font-size:18px;
letter-spacing:3px;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.3;}
}

</style>
</head>

<body>

<div class="app">

<div class="overlay"></div>

<div class="top">
<div>☰</div>
<div>COASTAL ZONE</div>
</div>

<div class="center">

<div>
<div class="logo">DRAGON SENSE</div>
<div class="sub">hidden world. real presence.</div>
</div>

<div class="signal"></div>

<div class="status">SIGNAL UNSTABLE</div>

<div class="message">
THE VEIL IS THIN HERE
</div>

<div class="small">
No nearby resonance detected.
</div>

<button class="btn" onclick="huntDragon()">
ACTIVATE SENSE
</button>

</div>

<div class="bottom">
<div class="nav">SENSE</div>
<div class="nav">MY DRAGON</div>
<div class="nav">DISCOVERIES</div>
<div class="nav">ARCHIVE</div>
</div>

</div>

<div class="reveal" id="reveal">

<div class="scan" id="scanText">
SCANNING...
</div>

</div>

<script>

const dragons = [

{
name:"EMBERCLAW",
rarity:"COMMON"
},

{
name:"FROSTFANG",
rarity:"RARE"
},

{
name:"VOIDSERPENT",
rarity:"EPIC"
},

{
name:"THE ANCIENT",
rarity:"LEGENDARY"
}

];

function huntDragon(){

const reveal = document.getElementById("reveal");
const scanText = document.getElementById("scanText");

reveal.style.display="flex";

scanText.innerHTML="SCANNING REALITY...";

setTimeout(()=>{

scanText.innerHTML="SIGNAL LOCKED";

},2000);

setTimeout(()=>{

const dragon = dragons[Math.floor(Math.random()*dragons.length)];

reveal.innerHTML=`

<div class="dragon">
🐉 ${dragon.name}
</div>

<div class="rarity">
${dragon.rarity}
</div>

<div class="scan">
TAP TO CONTINUE
</div>

`;

saveDragon(dragon);

reveal.onclick=()=>{

reveal.style.display="none";

reveal.innerHTML=`
<div class="scan" id="scanText">
SCANNING...
</div>
`;

};

},4000);

}

function saveDragon(dragon){

let vault = JSON.parse(localStorage.getItem("dragons")) || [];

vault.push(dragon);

localStorage.setItem("dragons",JSON.stringify(vault));

}

</script>

</body>
</html>
