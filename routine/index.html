// 🔘 BUILD BUTTONS
function create(section, items){
  let html = `<h3>${section}</h3>`;
  items.forEach((item,i)=>{
    const key = day.name + section + i;
    const isDone = localStorage.getItem(key) === "1";

    html += `<button class="${isDone ? 'done' : ''}" 
      onclick="tap(this,'${key}','${item}')">
      ${item}
    </button>`;
  });
  return html;
}

// 💧 WATER TRACKER
function loadWater(){
  for(let i = 0; i < 3; i++){
    const key = day.name + "Water" + i;
    const bottle = document.getElementById("water" + i);

    if(localStorage.getItem(key) === "1"){
      bottle.classList.add("doneWater");
      bottle.innerText = "✓";
    }
  }
}

function toggleWater(i){
  const key = day.name + "Water" + i;
  const bottle = document.getElementById("water" + i);
  const done = bottle.classList.toggle("doneWater");

  localStorage.setItem(key, done ? "1" : "0");
  bottle.innerText = done ? "✓" : "💧";
}

loadWater();

// ✅ TAP FUNCTION
function tap(el,key,item){
  const done = el.classList.toggle("done");
  localStorage.setItem(key, done ? "1" : "0");

  document.getElementById("title").innerText = item;
  document.getElementById("info").innerHTML = info[item];
  document.getElementById("popup").style.display = "block";
}

// ❌ CLOSE POPUP
function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function toggleQuote(){
  const box = document.getElementById("quoteBox");

  if(box.style.display === "none"){
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}

function toggleRetinolRoutine(){
