<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Sense</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
-webkit-tap-highlight-color:transparent;
}

body{
background:black;
color:white;
overflow:hidden;
height:100vh;
}

.app{
position:relative;
height:100vh;
background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop') center center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
backdrop-filter:blur(2px);
}

.top{
position:relative;
z-index:2;
display:flex;
justify-content:space-between;
padding:25px;
font-size:14px;
letter-spacing:3px;
}

.center{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
margin-top:20px;
}

.logo{
font-size:60px;
text-align:center;
letter-spacing:10px;
font-weight:200;
line-height:1.1;
}

.sub{
margin-top:20px;
opacity:0.7;
letter-spacing:4px;
font-size:13px;
text-align:center;
}

.radar{
width:240px;
height:240px;
border-radius:50%;
border:1px solid rgba(255,255,255,0.1);
margin:40px 0;
position:relative;
animation:pulse 2s infinite;
}

.radar::before,
.radar::after{
content:'';
position:absolute;
inset:30px;
border-radius:50%;
border:1px solid rgba(255,255,255,0.08);
}

.radar::after{
inset:70px;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.04);}
100%{transform:scale(1);}
}

.status{
font-size:14px;
letter-spacing:4px;
opacity:0.7;
margin-bottom:20px;
}

.message{
font-size:42px;
text-align:center;
letter-spacing:5px;
line-height:1.2;
}

.small{
margin-top:20px;
opacity:0.7;
letter-spacing:2px;
font-size:14px;
text-align:center;
}

.activate{
position:fixed;
bottom:120px;
left:50%;
transform:translateX(-50%);
z-index:5;
padding:22px 40px;
border:none;
background:rgba(0,0,0,0.7);
border:1px solid rgba(255,255,255,0.2);
color:white;
font-size:22px;
letter-spacing:4px;
border-radius:18px;
backdrop-filter:blur(10px);
width:85%;
max-width:420px;
}

.activate:active{
transform:translateX(-50%) scale(0.96);
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:85px;
background:rgba(0,0,0,0.85);
display:grid;
grid-template-columns:repeat(4,1fr);
z-index:10;
border-top:1px solid rgba(255,255,255,0.08);
}

.nav{
display:flex;
justify-content:center;
align-items:center;
font-size:12px;
letter-spacing:2px;
opacity:0.8;
}

.reveal{
position:fixed;
inset:0;
background:black;
z-index:999;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:30px;
text-align:center;
}

.scan{
font-size:22px;
letter-spacing:5px;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:0.4;}
}

.dragon{
font-size:48px;
margin-bottom:20px;
}

.rarity{
font-size:24px;
letter-spacing:4px;
margin-bottom:30px;
}

.common{color:#bbbbbb;}
.rare{color:#4fc3f7;}
.epic{color:#c77dff;}
.legendary{color:gold;}

.tap{
opacity:0.7;
letter-spacing:3px;
margin-top:20px;
}

.vault{
position:fixed;
inset:0;
background:#050505;
z-index:998;
display:none;
overflow:auto;
padding:30px;
}

.vault h1{
margin-bottom:30px;
letter-spacing:4px;
}

.card{
background:#111;
padding:20px;
border-radius:16px;
margin-bottom:15px;
border:1px solid rgba(255,255,255,0.08);
}

.close{
position:fixed;
top:20px;
right:20px;
background:white;
color:black;
border:none;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="app">

<div class="overlay"></div>

<div class="top">
<div>☰</div>
<div>COASTAL ZONE</div>
</div>

<div class="center">

<div class="logo">
DRAGON<br>SENSE
</div>

<div class="sub">
hidden world. real presence.
</div>

<div class="radar"></div>

<div class="status">
SIGNAL UNSTABLE
</div>

<div class="message">
THE VEIL IS THIN HERE
</div>

<div class="small">
No nearby resonance detected.
</div>

</div>

<button class="activate" onclick="huntDragon()">
ACTIVATE SENSE
</button>

<div class="bottom">
<div class="nav">SENSE</div>
<div class="nav" onclick="openVault()">MY DRAGONS</div>
<div class="nav">DISCOVERIES</div>
<div class="nav">ARCHIVE</div>
</div>

</div>

<div class="reveal" id="reveal">
<div class="scan" id="scanText">
SCANNING...
</div>
</div>

<div class="vault" id="vault">

<button class="close" onclick="closeVault()">
X
</button>

<h1>MY DRAGONS</h1>

<div id="vaultContent"></div>

</div>

<script>

const dragons = [

{name:"EMBERCLAW",rarity:"COMMON"},
{name:"FROSTFANG",rarity:"RARE"},
{name:"VOIDSERPENT",rarity:"EPIC"},
{name:"THE ANCIENT",rarity:"LEGENDARY"}

];

function huntDragon(){

const reveal=document.getElementById("reveal");
const scan=document.getElementById("scanText");

reveal.style.display="flex";

scan.innerHTML="SCANNING REALITY...";

setTimeout(()=>{

scan.innerHTML="SIGNAL LOCKED";

},1500);

setTimeout(()=>{

const dragon=dragons[Math.floor(Math.random()*dragons.length)];

let rarityClass=dragon.rarity.toLowerCase();

reveal.innerHTML=`

<div class="dragon">
🐉 ${dragon.name}
</div>

<div class="rarity ${rarityClass}">
${dragon.rarity}
</div>

<div class="tap">
TAP ANYWHERE
</div>

`;

saveDragon(dragon);

reveal.onclick=()=>{

reveal.style.display="none";

reveal.innerHTML=`
<div class="scan" id="scanText">
SCANNING...
</div>
`;

};

},3500);

}

function saveDragon(dragon){

let vault=JSON.parse(localStorage.getItem("dragons")) || [];

vault.push(dragon);

localStorage.setItem("dragons",JSON.stringify(vault));

}

function openVault(){

const vault=document.getElementById("vault");

vault.style.display="block";

const content=document.getElementById("vaultContent");

let dragonsSaved=JSON.parse(localStorage.getItem("dragons")) || [];

if(dragonsSaved.length===0){

content.innerHTML="<p>No dragons discovered yet.</p>";
return;

}

content.innerHTML="";

dragonsSaved.forEach(dragon=>{

content.innerHTML+=`

<div class="card">
<h2>${dragon.name}</h2>
<p>${dragon.rarity}</p>
</div>

`;

});

}

function closeVault(){

document.getElementById("vault").style.display="none";

}

</script>

</body>
</html>
