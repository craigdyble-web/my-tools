<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Routine</title>

<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2922/2922510.png">

<style>
body {
  font-family: -apple-system, Arial;
  background: #0f0f0f;
  color: white;
  padding: 20px;
}

h1 {
  text-align:center;
}

.card {
  background:#1c1c1e;
  padding:20px;
  border-radius:16px;
}

.dailyQuote {
  text-align: center;
  color: #9a9a9a;
  font-size: 14px;
  line-height: 1.5;
  margin: 5px 0 20px;
}

.quoteBox {
  background:#151515;
  border:1px solid #2a2a2a;
  border-radius:14px;
  padding:14px;
  margin:0 0 20px;
  text-align:center;
}

.quoteTitle {
  color:#666;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:6px;
}

.quoteText {
  color:white;
  font-size:18px;
  font-weight:600;
  line-height:1.4;
}

button {
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#2ecc71;
  color:white;
  font-size:16px;
  transition:0.2s;
}

button:active {
  transform: scale(0.97);
}

.done {
  background:#444 !important;
  text-decoration: line-through;
  opacity: 0.7;
}

.popup {
  position: fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#1c1c1e;
  padding:20px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  display:none;
  max-height:60%;
  overflow-y:auto;
  box-sizing:border-box;
}

.close {
  background:#e74c3c;
}

/* PASSWORD SCREEN */
#lockScreen {
  position: fixed;
  inset: 0;
  background: #0f0f0f;
  color: white;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, Arial;
  padding: 25px;
  text-align: center;
}

#lockScreen h2 {
  margin-bottom: 10px;
}

#passwordBox {
  width: 100%;
  max-width: 320px;
  padding: 14px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  margin: 12px 0;
  text-align: center;
}

#wrongPassword {
  color: #ff6b6b;
  display: none;
}
</style>
</head>

<body>

<!-- PASSWORD LOCK -->
<div id="lockScreen">
  <h2>🔒 Tool Locked</h2>
  <p>Enter password to open your routine</p>
  <input id="passwordBox" type="password" placeholder="Password">
  <button onclick="unlockTool()">Unlock</button>
  <p id="wrongPassword">Wrong password</p>
</div>

<h1>My Routine</h1>

<div class="card" id="app"></div>

<div class="popup" id="popup">
  <h3 id="title"></h3>
  <p id="info"></p>
  <button class="close" onclick="closePopup()">Close</button>
</div>

<script>

// 🔐 PASSWORD
const correctPassword = "craig123";

function unlockTool() {
  const password = document.getElementById("passwordBox").value;

  if (password === correctPassword) {
    document.getElementById("lockScreen").style.display = "none";
    localStorage.setItem("routineUnlocked", "1");
  } else {
    document.getElementById("wrongPassword").style.display = "block";
  }
}

// Keeps it unlocked after first login
if (localStorage.getItem("routineUnlocked") === "1") {
  document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("lockScreen").style.display = "none";
  });
}

// 🧠 PRODUCT INFO
const info = {

"Cleanser":
"🧼 CeraVe Foaming Cleanser<br><br><b>How:</b> Massage 30–60 sec, rinse<br><b>When:</b> Morning + Night",

"Moisturiser":
"💧 CeraVe Moisturising Lotion<br><br><b>How:</b> Apply after products<br><b>When:</b> Morning + Night",

"SPF":
"☀️ SPF 50<br><br><b>How:</b> Last step every morning<br><b>When:</b> Daily<br><br>⚠️ Essential with retinol",

"Vitamin C":
"🍊 L’Oréal Vitamin C Serum<br><br><b>How:</b> Small amount<br><b>When:</b> Morning<br><br>⚠️ Start every other day<br>⚠️ Contains salicylic acid",

"Retinol":
"🌙 CeraVe Retinol Serum<br><br><b>How:</b> Pea-sized<br><b>When:</b> Night (2–3x week)<br><br>⚠️ SPF 50 is essential tomorrow<br>⚠️ Do NOT use with tan",

"Tan":
"🟤 Bondi Sands Tan<br><br><b>How:</b> Small amount<br><b>When:</b> Night (2–3x week)<br><br>⚠️ Use on non-retinol nights"
};

// 📅 WEEK PLAN
const days = [
{ name:"Monday", am:["Cleanser","Vitamin C","Moisturiser","SPF"], pm:["Cleanser","Retinol","Moisturiser"] },
{ name:"Tuesday", am:["Cleanser","Moisturiser","SPF"], pm:["Cleanser","Tan"] },
{ name:"Wednesday", am:["Cleanser","Vitamin C","Moisturiser","SPF"], pm:["Cleanser","Moisturiser"] },
{ name:"Thursday", am:["Cleanser","Moisturiser","SPF"], pm:["Cleanser","Retinol","Moisturiser"] },
{ name:"Friday", am:["Cleanser","Vitamin C","Moisturiser","SPF"], pm:["Cleanser","Tan"] },
{ name:"Saturday", am:["Cleanser","Moisturiser","SPF"], pm:["Cleanser","Moisturiser"] },
{ name:"Sunday", am:["Cleanser","Vitamin C","Moisturiser","SPF"], pm:["Cleanser","Moisturiser"] }
];

// 📍 GET TODAY
const today = new Date().getDay();
const index = today === 0 ? 6 : today - 1;
const day = days[index];

const app = document.getElementById("app");

// 🔘 BUILD BUTTONS
function create(section, items){
  let html = `<h3>${section}</h3>`;
  items.forEach((item,i)=>{
    const key = day.name + section + i;
    const isDone = localStorage.getItem(key) === "1";

    html += `<button class="${isDone ? 'done' : ''}"
      onclick="tap(this,'${key}','${item}')">
      ${item}
    </button>`;
  });
  return html;
}

// 📲 RENDER
app.innerHTML = `
<h2>${day.name}</h2>

<p class="dailyQuote">
Men don’t read instructions.<br>
This app stops you wrecking your face.
</p>

<button onclick="toggleQuote()" id="quoteButton">
  Quote of the Day
</button>

<div class="quoteBox" id="quoteBox" style="display:none;">
  <div class="quoteText">
    "Raise first, die last"
  </div>
</div>

${create("AM", day.am)}
${create("PM", day.pm)}
`;

// ✅ TAP FUNCTION
function tap(el,key,item){
  const done = el.classList.toggle("done");
  localStorage.setItem(key, done ? "1" : "0");

  document.getElementById("title").innerText = item;
  document.getElementById("info").innerHTML = info[item];
  document.getElementById("popup").style.display = "block";
}

// ❌ CLOSE POPUP
function closePopup(){
  document.getElementById("popup").style.display = "none";
}

function toggleQuote(){
  const box = document.getElementById("quoteBox");

  if(box.style.display === "none"){
    box.style.display = "block";
  } else {
    box.style.display = "none";
  }
}

</script>

</body>
</html>
```
