<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movement</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Movement">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --blue:#005BBB;
  --blue2:#0047a8;
  --red:#D32F2F;
  --red2:#c41414;
  --green:#149447;
  --green2:#087a35;
  --text:#101828;
  --muted:#667085;
  --line:#d0d5dd;
  --bg:#f5f7fb;
  --card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:980px;margin:auto;padding:22px}
.card{background:var(--card);padding:28px;border-radius:16px;box-shadow:0 8px 24px rgba(16,24,40,.10);border:1px solid #eaecf0}
.brand-header{display:flex;align-items:center;gap:28px;margin-bottom:22px;flex-wrap:wrap}
.playnation-logo{display:block;max-width:500px;width:52%;min-width:280px;height:auto}
.brand-header h1{margin:0;color:var(--text);font-size:30px;line-height:1.1;font-weight:800;white-space:nowrap}
h1{margin-top:0;color:var(--text)}
h2{font-size:28px;line-height:1.15;margin:22px 0 12px 0}
label{display:block;font-weight:700;margin-bottom:8px}
input,select,textarea{width:100%;padding:16px 18px;font-size:20px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text);box-sizing:border-box}
input::placeholder, textarea::placeholder{color:#8a8f98}
textarea{min-height:80px;resize:vertical;font-family:Arial,sans-serif}
input[type="file"]{background:#fff;border:1px dashed var(--blue)}
button{width:100%;padding:16px;font-size:20px;border:none;border-radius:9px;margin-top:12px;cursor:pointer;font-weight:800}
.next{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.back{background:linear-gradient(135deg,var(--red),var(--red2));color:white}
.danger{background:linear-gradient(135deg,var(--red),var(--red2));color:white}
.green,.signature-btn{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
.progress{height:16px;background:#e4e7ec;border-radius:10px;margin-bottom:12px;overflow:hidden}
.bar{height:100%;background:linear-gradient(135deg,var(--blue),var(--blue2));width:0%}
.step-text{text-align:center;color:var(--blue);font-size:20px;font-weight:700;margin:10px 0 20px}
.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.status-row{border-top:1px solid #eaecf0;margin-top:22px;padding-top:12px;text-align:right;font-size:22px;font-weight:800;color:var(--text)}
.helper-buttons{margin-top:10px}
.helper-buttons button{margin-top:10px}
.small{color:var(--muted);font-size:18px;line-height:1.45}
.machine-count{text-align:right;color:var(--muted);font-size:16px;line-height:1.4;margin:0 0 12px 0;font-weight:bold}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}
.photo-box{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.photo-box img{width:100%;display:block}
.photo-box button{margin:0;border-radius:0;background:var(--red);color:white;font-size:14px;padding:10px}
.photo-note{border-top:1px solid var(--line);padding:10px;background:#fff}
.photo-note label{display:block;font-size:14px;font-weight:bold;margin-bottom:6px;color:var(--text)}
.review-box{background:#fff;border:1px solid var(--line);padding:14px;border-radius:12px;margin:10px 0}
.notice{background:#f8fbff;border:1px solid #4e8dff;color:#0047bb;padding:14px 18px;border-radius:9px;margin:18px 0;font-size:20px}
.ok{background:#ecfdf3;border:1px solid #12b76a;color:#027a48;padding:12px;border-radius:12px;margin:12px 0}
.error{background:#fef3f2;border:1px solid var(--red);color:#b42318;padding:12px;border-radius:12px;margin:12px 0}
.transport-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.signature-pad{background:#fff;border:2px solid #98a2b3;border-radius:9px;width:100%;height:190px;touch-action:none;box-sizing:border-box}
.signature-preview{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:8px}
.signature-preview img{max-width:100%;height:auto;display:block}
.signature-actions{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.signature-actions button{margin-top:12px}
@media(max-width:760px){
  .container{padding:12px}
  .card{padding:18px}
  .brand-header{gap:12px}
  .playnation-logo{width:100%;max-width:430px;min-width:0}
  .brand-header h1{font-size:26px;white-space:normal}
  h2{font-size:26px}
  input,select,textarea,button{font-size:18px;min-height:58px}
  .nav-row,.transport-grid,.signature-actions{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:1fr}
  .machine-count,.status-row{text-align:right;font-size:18px}
}
</style>
</head>
<body>
<div class="container"><div class="card"><div class="brand-header"><img class="playnation-logo" src="./playnation.png" alt="PLAYNATION logo"><h1>Machine Movement App</h1></div><div class="progress"><div class="bar" id="bar"></div></div><div id="stepText" class="step-text"></div><div id="app"></div></div></div>
<script>
const steps=[
  ["Current Site","currentSite","text"],
  ["Movement Date","movementDate","date"],
  ["Movement Type","movementType","select"],
  ["Destination / Received From","movementPlace","text"],
  ["Machine Name","machineName","text"],
  ["Model","model","text"],
  ["Stock Number","stock","text"],
  ["Serial Number","serial","text"],
  ["Machine Photos","photos","photos"]
];

const MAX_MACHINES=8;
let current=0;
let data=JSON.parse(localStorage.getItem("machineMovementLockedBase") || "{}");
if(!Array.isArray(data.machines)) data.machines=[];
if(!data.photos) data.photos=[];
if(!Array.isArray(data.photoNotes)) data.photoNotes=[];
if(!data.signature) data.signature="";
if(!data.collectingCompany) data.collectingCompany="";
if(!data.collectionDriver) data.collectionDriver="";
if(!data.movementDate) data.movementDate=new Date().toISOString().slice(0,10);
let templateBuffer=null;
let templateName="";
const storedTemplateFiles=["template.xlsm","template.xlsx"];

function save(){
  try{
    localStorage.setItem("machineMovementLockedBase",JSON.stringify(data));
  }catch(err){
    alert("Storage full. Please export/download this sheet, then clear the form before adding more photos.");
    console.error(err);
  }
}
function movementPlaceLabel(item=data){return (String(item.movementType||"").toUpperCase()==="IN") ? "Received From" : "Destination";}
function movementTypeDisplay(item=data){return String(item.movementType||"").toUpperCase();}
function movementDateText(item=data){
  if(!item.movementDate) return todayText();
  const parts=String(item.movementDate).split("-");
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return item.movementDate;
}
function machineSnapshot(){
  return {
    currentSite:data.currentSite||"",
    movementDate:data.movementDate||new Date().toISOString().slice(0,10),
    movementType:movementTypeDisplay(),
    movementPlace:data.movementPlace||"",
    machineName:data.machineName||"",
    model:data.model||"",
    stock:data.stock||"",
    serial:data.serial||"",
    photos:Array.isArray(data.photos)?[...data.photos]:[],
    photoNotes:Array.isArray(data.photoNotes)?[...data.photoNotes]:[],
    signature:data.signature||""
  };
}
function currentMachineComplete(){
  return !!(data.currentSite && data.movementDate && data.movementType && data.movementPlace && data.machineName && data.model && data.stock && data.serial);
}
function needsTransportDetails(){
  const currentIsOut = movementTypeDisplay()==="OUT";
  const savedHasOut = Array.isArray(data.machines) && data.machines.some(m=>String(m.movementType||"").toUpperCase()==="OUT");
  return currentIsOut || savedHasOut;
}
function transportDetailsComplete(){
  if(!needsTransportDetails()) return true;
  return !!(String(data.collectingCompany||"").trim() && String(data.collectionDriver||"").trim());
}
function machinesForExport(){
  const list=Array.isArray(data.machines)?[...data.machines]:[];
  if(currentMachineComplete()) list.push(machineSnapshot());
  return list.slice(0,MAX_MACHINES);
}
function clearCurrentMachine(){
  data.currentSite="";
  data.movementDate=new Date().toISOString().slice(0,10);
  data.movementType="";
  data.movementPlace="";
  data.machineName="";
  data.model="";
  data.stock="";
  data.serial="";
  data.photos=[];
  data.photoNotes=[];
  data.signature="";
}
function addAnotherMachine(){
  if(!currentMachineComplete()){
    alert("Complete this machine before adding another one.");
    return;
  }
  if(!transportDetailsComplete()){
    alert("Please fill in Collecting Company and Collection Driver before adding another machine.");
    return;
  }
  if(data.machines.length>=MAX_MACHINES){
    alert("Maximum 8 machines per sheet.");
    return;
  }
  data.machines.push(machineSnapshot());
  if(data.machines.length>=MAX_MACHINES){
    save();
    alert("8 machines added. You can now download the sheet.");
    render();
    return;
  }
  clearCurrentMachine();
  save();
  current=0;
  render();
}

function hasCurrentMachineData(){
  return !!(data.currentSite || data.movementType || data.movementPlace || data.machineName || data.model || data.stock || data.serial || data.signature || (Array.isArray(data.photos) && data.photos.length) || (Array.isArray(data.photoNotes) && data.photoNotes.some(n=>String(n||"").trim())));
}
function returnToPreviousMachine(){
  if(!Array.isArray(data.machines) || data.machines.length===0){return;}
  if(hasCurrentMachineData() && !confirm("Return to previous machine? The current unfinished machine will be removed.")){return;}
  const previous=data.machines.pop();
  data.currentSite=previous.currentSite||"";
  data.movementDate=previous.movementDate||new Date().toISOString().slice(0,10);
  data.movementType=previous.movementType||"";
  data.movementPlace=previous.movementPlace||"";
  data.machineName=previous.machineName||"";
  data.model=previous.model||"";
  data.stock=previous.stock||"";
  data.serial=previous.serial||"";
  data.photos=Array.isArray(previous.photos)?[...previous.photos]:[];
  data.photoNotes=Array.isArray(previous.photoNotes)?[...previous.photoNotes]:[];
  data.signature=previous.signature||"";
  save();
  current=0;
  render();
}

function render(){
  const app=document.getElementById("app");
  if(current==="signature"){
    document.getElementById("bar").style.width="100%";
    document.getElementById("stepText").textContent="Signature";
    app.innerHTML=`<h2>Authorisation - Signature</h2><p class="small">Sign inside the box, then press Done. This will be added to the Transport Docket section of the Excel file.</p><canvas id="signatureCanvas" class="signature-pad"></canvas><div class="signature-actions"><button class="green" onclick="clearSignaturePad()">Clear Signature</button><button class="green" onclick="saveSignaturePad()">Done</button></div><button class="back" onclick="cancelSignaturePad()">Back</button>`;
    setTimeout(setupSignaturePad,50);
    return;
  }
  document.getElementById("bar").style.width=((current+1)/steps.length*100)+"%";
  document.getElementById("stepText").textContent=`Step ${Math.min(current+1,steps.length)} of ${steps.length}`;
  const savedCount=Array.isArray(data.machines)?data.machines.length:0;
  const returnPreviousButton=savedCount>0?'<button class="back" onclick="returnToPreviousMachine()">Return To Previous Machine</button>':'';
  const machineCountHtml=`<p class="machine-count">Machine ${Math.min(savedCount+1,MAX_MACHINES)} of ${MAX_MACHINES}</p>`;
  if(current<8){
    const step=steps[current];
    const key=step[1];
    let title=step[0];
    let inputHtml="";

    if(key==="movementPlace") title=movementPlaceLabel();

    if(step[2]==="select"){
      inputHtml=`<select id="field"><option value="">Select IN or OUT</option><option value="OUT" ${data.movementType==="OUT"?"selected":""}>OUT</option><option value="IN" ${data.movementType==="IN"?"selected":""}>IN</option></select>`;
    }else if(step[2]==="date"){
      inputHtml=`<input id="field" type="date" value="${escapeHtml(data[key]||new Date().toISOString().slice(0,10))}" autocomplete="off">`;
    }else{
      inputHtml=`<input id="field" value="${escapeHtml(data[key]||'')}" autocomplete="off">`;
    }

    app.innerHTML=`<h2>${title}</h2>${inputHtml}
      <div class="nav-row">
        <button class="back" onclick="backStep()" ${current===0?'disabled':''}>← Back</button>
        <button class="next" onclick="nextStep()">Next →</button>
      </div>
      <div class="status-row">Machines added: ${savedCount} / ${MAX_MACHINES}</div>
      <div class="helper-buttons">
        ${savedCount>0?'<button class="next" onclick="current=9;render()">Review Machines Added To This Sheet</button>':''}
        <button class="next" onclick="addAnotherMachine()">Add Another Machine To This Sheet</button>
        <button class="next" onclick="clearForm()">Clear All Data</button>
      </div>
      <div class="notice">Please review all machine details before adding to the sheet.</div>
      ${returnPreviousButton}`;
  }else if(current===8){
    app.innerHTML=`<h2>Machine Photos</h2>${machineCountHtml}<p class="small">Take or upload up to 5 photos of the machine. Add a short note under any photo, for example damage or marks.</p><input id="photoInput" type="file" accept="image/*" capture="environment" multiple onchange="addPhotos(event)"><p class="small">${data.photos.length} of 5 photos added</p><div class="photo-grid">${data.photos.map((p,i)=>`<div class="photo-box"><img src="${p}"><div class="photo-note"><label>Photo ${i+1} Note</label><textarea placeholder="Example: Damage on left side panel" oninput="updatePhotoNote(${i}, this.value)">${escapeHtml((data.photoNotes||[])[i]||'')}</textarea></div><button onclick="removePhoto(${i})">Remove photo</button></div>`).join("")}</div><div class="nav-row"><button class="back" onclick="backStep()">← Back</button><button class="next" onclick="nextStep()">Next →</button></div>${returnPreviousButton}`;
  }else{
    const exportCount=machinesForExport().length;
    const canAdd=savedCount<MAX_MACHINES;
    app.innerHTML=`<h2>Review</h2>
      <p class="machine-count">${exportCount} of ${MAX_MACHINES} machines ready</p>
      ${savedCount>0?`<div class="review-box"><strong>Saved Machines:</strong><br>${savedCount} already added to this sheet</div>`:""}
      <div class="review-box"><strong>Current Site:</strong><br>${escapeHtml(data.currentSite||'')}</div>
      <div class="review-box"><strong>Movement Date:</strong><br>${escapeHtml(movementDateText())}</div>
      <div class="review-box"><strong>Movement Type:</strong><br>${escapeHtml(movementTypeDisplay())}</div>
      <div class="review-box"><strong>${escapeHtml(movementPlaceLabel())}:</strong><br>${escapeHtml(data.movementPlace||'')}</div>
      <div class="review-box"><strong>Machine Name:</strong><br>${escapeHtml(data.machineName||'')}</div>
      <div class="review-box"><strong>Model:</strong><br>${escapeHtml(data.model||'')}</div>
      <div class="review-box"><strong>Stock Number:</strong><br>${escapeHtml(data.stock||'')}</div>
      <div class="review-box"><strong>Serial Number:</strong><br>${escapeHtml(data.serial||'')}</div>
      <div class="review-box"><strong>Photos:</strong><br>${data.photos.length} attached</div>
      <div class="photo-grid">${data.photos.map((p,i)=>`<div class="photo-box"><img src="${p}">${((data.photoNotes||[])[i]||"").trim()?`<div class="photo-note"><strong>Note:</strong><br>${escapeHtml((data.photoNotes||[])[i]||"")}</div>`:""}</div>`).join("")}</div>
      ${needsTransportDetails()?`<h2>OUT Movement - Transport Details</h2><div class="transport-grid"><div><label><strong>Collecting Company</strong></label><input id="collectingCompany" placeholder="Enter collecting company" value="${escapeHtml(data.collectingCompany||'')}" oninput="updateTransportDetail('collectingCompany',this.value)" autocomplete="off"></div><div><label><strong>Collection Driver</strong></label><input id="collectionDriver" placeholder="Enter collection driver" value="${escapeHtml(data.collectionDriver||'')}" oninput="updateTransportDetail('collectionDriver',this.value)" autocomplete="off"></div></div>`:""}
      <h2>Authorisation - Signature</h2><div class="review-box"><strong>Signature:</strong><br>${data.signature?"Signature saved":"No signature added yet"}${data.signature?`<div class="signature-preview"><img src="${data.signature}" alt="Saved signature"></div>`:""}</div><div class="signature-actions"><button class="signature-btn" onclick="openSignaturePad()">✎ Add Signature</button><button class="signature-btn" onclick="clearSavedSignature()">⌫ Clear Signature</button></div>
      ${canAdd?'<button class="next" onclick="addAnotherMachine()">Add Another Machine To This Sheet</button>':'<div class="ok">Maximum 8 machines added.</div>'}
      <button class="next" onclick="shareExcelFile('Excel export')">Download / Save / Share Excel File</button>
      <p class="small">Choose Mail, Outlook, OneDrive, Files, Google Drive, WhatsApp, Teams, AirDrop, or Save to Downloads from your device share options. If sharing is not supported, the Excel file will download automatically.</p>
      <button class="back" onclick="backStep()">Back</button>
      ${returnPreviousButton}
      <button class="danger" onclick="clearForm()">Clear Form</button>`;
  }
}
function updateTransportDetail(key,value){data[key]=value;save();}
function openSignaturePad(){current="signature";render();}
function cancelSignaturePad(){current=9;render();}
function setupSignaturePad(){
  const canvas=document.getElementById("signatureCanvas");
  if(!canvas) return;
  const rect=canvas.getBoundingClientRect();
  const ratio=Math.max(window.devicePixelRatio || 1, 1);
  canvas.width=Math.round(rect.width*ratio);
  canvas.height=Math.round(rect.height*ratio);
  const ctx=canvas.getContext("2d");
  ctx.scale(ratio,ratio);
  ctx.lineWidth=3;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.strokeStyle="#111827";
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,rect.width,rect.height);
  if(data.signature){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);
    img.src=data.signature;
  }
  let drawing=false;
  function point(e){
    const r=canvas.getBoundingClientRect();
    const t=e.touches && e.touches.length ? e.touches[0] : e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  }
  function start(e){e.preventDefault();drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function move(e){if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();}
  function end(e){if(!drawing)return;e.preventDefault();drawing=false;}
  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end,{passive:false});
}
function clearSavedSignature(){
  data.signature="";
  save();
  render();
}
function clearSignaturePad(){
  data.signature="";
  save();
  setupSignaturePad();
}
function saveSignaturePad(){
  const canvas=document.getElementById("signatureCanvas");
  if(!canvas){current=9;render();return;}
  data.signature=canvas.toDataURL("image/png");
  save();
  current=9;
  render();
}

function nextStep(){
  if(current<8){
    const field=document.getElementById("field");
    if(!field.value.trim()) return;
    const key=steps[current][1];
    data[key]=field.value.trim();
    if(key==="movementType"){
      data.movementType=data.movementType.toUpperCase();
      data.movementPlace="";
      if(data.movementType!=="OUT"){ data.collectingCompany=""; data.collectionDriver=""; }
    }
    save();
  }
  current++;render();
}
function backStep(){if(current>0){current--;render();}}
function compressImage(file, maxWidth = 1200, quality = 0.65){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function addPhotos(event){
  const files = Array.from(event.target.files);
  const remaining = 5 - data.photos.length;
  if(remaining <= 0){
    alert("Maximum 5 photos allowed.");
    return;
  }
  try{
    for(const file of files.slice(0, remaining)){
      const compressed = await compressImage(file);
      data.photos.push(compressed);
      if(!Array.isArray(data.photoNotes)) data.photoNotes = [];
      data.photoNotes.push("");
      save();
    }
    if(files.length > remaining){
      alert("Only 5 photos maximum. Extra photos were not added.");
    }
    event.target.value = "";
    render();
  }catch(err){
    alert("Photo save failed. Try taking fewer photos or smaller photos.");
    console.error(err);
  }
}
function updatePhotoNote(index,value){if(!Array.isArray(data.photoNotes)) data.photoNotes=[];data.photoNotes[index]=value;save();}
function removePhoto(index){data.photos.splice(index,1);if(Array.isArray(data.photoNotes)) data.photoNotes.splice(index,1);save();render();}
function clearForm(){if(confirm("Clear this movement form and all added machines?")){data={machines:[],photos:[],photoNotes:[],signature:"",collectingCompany:"",collectionDriver:"",movementDate:new Date().toISOString().slice(0,10)};save();current=0;templateBuffer=null;templateName="";render();}}
async function loadStoredTemplate(){
  if(templateBuffer) return templateBuffer;
  let lastError="";
  for(const fileName of storedTemplateFiles){
    try{
      const response=await fetch(fileName,{cache:"no-store"});
      if(!response.ok){lastError=`${fileName}: ${response.status}`; continue;}
      templateBuffer=await response.arrayBuffer();
      templateName=fileName;
      return templateBuffer;
    }catch(err){lastError=err.message;}
  }
  throw new Error("Stored template not found. Put template.xlsm or template.xlsx in the same GitHub folder as this HTML file. " + lastError);
}
function setCell(ws,address,value){const cell=ws.getCell(address);cell.value=value || "";}
function getSheet(workbook,names){for(const n of names){const ws=workbook.getWorksheet(n);if(ws)return ws;}return workbook.worksheets[0];}
function todayText(){return new Date().toLocaleDateString("en-GB");}
function excelColumn(n){
  let s="";
  while(n>0){
    let m=(n-1)%26;
    s=String.fromCharCode(65+m)+s;
    n=Math.floor((n-1)/26);
  }
  return s;
}
function movementColumn(index){return excelColumn(2+index);}
function docketRow(index){return 5+index;}
function outputFileName(){
  const site=String(data.currentSite||"site").trim().replace(/[^a-z0-9]+/gi,"-").replace(/^-+|-+$/g,"") || "site";
  const date=String(data.movementDate||new Date().toISOString().slice(0,10));
  return `machine-movement-${site}-${date}.xlsx`;
}
async function buildExcelBlob(){
  const machines=machinesForExport();
  if(machines.length===0){throw new Error("Add at least one machine before exporting.");}
  const hasOutMovement=machines.some(m=>String(m.movementType||"").toUpperCase()==="OUT");
  if(hasOutMovement && (!String(data.collectingCompany||"").trim() || !String(data.collectionDriver||"").trim())){
    throw new Error("Please fill in Collecting Company and Collection Driver on the first machine review before exporting.");
  }
  await loadStoredTemplate();
  const workbook=new ExcelJS.Workbook();
  await workbook.xlsx.load(templateBuffer);
  workbook.creator="Machine Movement App";
  workbook.modified=new Date();
  const movement=getSheet(workbook,["Master Movement","Movement"]);
  const docket=getSheet(workbook,["Transport Docket","Docket"]);

  machines.forEach((m,i)=>{
    const moveDate=movementDateText(m);
    const moveType=movementTypeDisplay(m);
    const placeLabel=movementPlaceLabel(m);
    const dr=docketRow(i);

    if(movement){
      const mc=movementColumn(i);

      // Master Movement fixed layout:
      // One machine = one column.
      // The machine details go DOWN the rows, not left-to-right across row 5.
      // Machine 1 uses column B, Machine 2 uses column C, etc.
      setCell(movement,"A1","Action Site");
      setCell(movement,"A2","Date");
      setCell(movement,"A3","Movement");
      setCell(movement,"A5","Machine Name");
      setCell(movement,"A6","Model");
      setCell(movement,"A7","Stock");
      setCell(movement,"A8","Serial");
      setCell(movement,"A10",placeLabel);
      setCell(movement,"A11","Location");

      for(let r=1;r<=11;r++){
        setCell(movement,`${mc}${r}`,"");
      }

      setCell(movement,`${mc}1`,m.currentSite);
      setCell(movement,`${mc}2`,moveDate);
      setCell(movement,`${mc}3`,moveType);
      setCell(movement,`${mc}5`,m.machineName);
      setCell(movement,`${mc}6`,m.model);
      setCell(movement,`${mc}7`,m.stock);
      setCell(movement,`${mc}8`,m.serial);
      setCell(movement,`${mc}10`,m.movementPlace);
      setCell(movement,`${mc}11`,m.currentSite);
    }
    if(docket){
      setCell(docket,`A${dr}`,m.currentSite);
      setCell(docket,`B${dr}`,moveDate);
      setCell(docket,`C${dr}`,m.machineName);
      setCell(docket,`D${dr}`,m.model);
      setCell(docket,`E${dr}`,m.stock);
      setCell(docket,`F${dr}`,m.serial);
      setCell(docket,`G${dr}`,m.movementPlace);
      setCell(docket,`H${dr}`,"");
    }
  });

  if(docket){
    const firstSignatureMachine=machines.find(m=>m.signature) || null;
    const transportSignature=data.signature || (firstSignatureMachine && firstSignatureMachine.signature) || "";

    if(String(data.collectingCompany||"").trim()){
      setCell(docket,"A16","Collecting Company");
      setCell(docket,"B16",data.collectingCompany);
    }
    if(String(data.collectionDriver||"").trim()){
      setCell(docket,"A18","Collecting Driver");
      setCell(docket,"B18",data.collectionDriver);
    }
    if(transportSignature){
      try{
        const signatureId=workbook.addImage({base64:transportSignature,extension:"png"});

        // ExcelJS image coordinates are zero-based.
        // col:3,row:15 starts around cell D16 on the Transport Docket.
        setCell(docket,"D15","Received By:");
        docket.addImage(signatureId,{
          tl:{col:3,row:15},
          ext:{width:260,height:80}
        });
      }catch(err){
        console.error("Signature insert failed",err);
        throw new Error("Signature could not be added to the Excel sheet. Please clear and re-sign, then export again.");
      }
    }
  }

  let photos=workbook.getWorksheet("Photos");
  if(!photos) photos=workbook.addWorksheet("Photos");
  photos.spliceRows(1, photos.rowCount || 1);
  photos.getCell("A1").value="Machine Photos";
  photos.getCell("A1").font={bold:true,size:16};
  photos.getColumn(1).width=18; photos.getColumn(2).width=70;
  let row=3;
  let photoCount=0;
  machines.forEach((m,mi)=>{
    photos.getCell(`A${row}`).value=`Machine ${mi+1}: ${m.machineName || ""}`;
    photos.getCell(`A${row}`).font={bold:true};
    row+=2;
    const pics=Array.isArray(m.photos)?m.photos:[];
    const notes=Array.isArray(m.photoNotes)?m.photoNotes:[];
    if(pics.length===0){photos.getCell(`A${row}`).value="No photos added"; row+=2; return;}
    pics.forEach((src,pi)=>{
      photoCount++;
      const ext=src.includes("image/png")?"png":"jpeg";
      const imageId=workbook.addImage({base64:src,extension:ext});
      photos.getCell(`A${row}`).value=`Photo ${pi+1}`;
      photos.addImage(imageId,{tl:{col:1,row:row-1},ext:{width:360,height:260}});
      for(let r=row;r<row+16;r++) photos.getRow(r).height=18;
      row+=16;
      const note=String(notes[pi]||"").trim();
      if(note){
        photos.getCell(`A${row}`).value="Note";
        photos.getCell(`B${row}`).value=note;
        photos.getCell(`B${row}`).alignment={wrapText:true,vertical:"top"};
        photos.getRow(row).height=45;
        row+=2;
      }else{
        row+=2;
      }
    });
    row+=2;
  });
  if(photoCount===0 && machines.every(m=>!m.photos || m.photos.length===0)){photos.getCell("A3").value="No photos added";}

  const out=await workbook.xlsx.writeBuffer();
  return new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function downloadBlob(blob,fileName){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=fileName;
  a.click();
  URL.revokeObjectURL(url);
}
async function downloadExcelFile(){
  try{
    const blob=await buildExcelBlob();
    downloadBlob(blob,outputFileName());
  }catch(err){
    alert("Excel export failed: "+err.message);
    console.error(err);
  }
}
async function shareExcelFile(actionName){
  try{
    const blob=await buildExcelBlob();
    const fileName=outputFileName();
    const file=new File([blob],fileName,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

    // Mobile/iPhone: use the share sheet when allowed.
    // Laptop/desktop: if sharing is blocked or denied, fall back to normal download.
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      try{
        await navigator.share({
          title:"Machine Movement Sheet",
          text:"Machine movement Excel file attached.",
          files:[file]
        });
        return;
      }catch(shareErr){
        console.warn("Share failed, falling back to download:", shareErr);
      }
    }

    downloadBlob(blob,fileName);

  }catch(err){
    alert(`${actionName} failed: `+err.message);
    console.error(err);
  }
}
function escapeHtml(str){return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
render();
