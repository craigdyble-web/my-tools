<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Brief</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #06111f, #111827);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 7vw, 54px);
      letter-spacing: -1.5px;
    }

    .small {
      color: #94a3b8;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 18px;
      background: #38bdf8;
      color: #082f49;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    #aiBtn {
      background: #a855f7;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      color: #94a3b8;
      min-height: 22px;
      margin-bottom: 14px;
      font-size: 14px;
    }

    #summary {
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      line-height: 1.58;
      font-size: 17px;
      white-space: pre-line;
      min-height: 230px;
    }

    .footer {
      margin-top: 14px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 620px) {
      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>World Brief</h1>
    <div class="small">Press one button for a short written news summary. UK news comes first, then world news.</div>

    <div class="buttons">
      <button id="worldBtn" type="button">Update World</button>
      <button id="aiBtn" type="button">Latest AI News</button>
    </div>

    <div id="status">Ready.</div>
    <div id="summary">Your summary will appear here.</div>

    <div class="footer">Simple version: one button, one summary. No cards, no filters.</div>
  </main>

  <script>
    const worldBtn = document.getElementById("worldBtn");
    const aiBtn = document.getElementById("aiBtn");
    const statusBox = document.getElementById("status");
    const summaryBox = document.getElementById("summary");

    const RSS_PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";

    const WORLD_FEEDS = [
      "https://feeds.bbci.co.uk/news/uk/rss.xml",
      "https://feeds.bbci.co.uk/news/world/rss.xml",
      "https://www.theguardian.com/uk-news/rss",
      "https://www.theguardian.com/world/rss"
    ];

    const AI_FEEDS = [
      "https://feeds.feedburner.com/TechCrunch/artificial-intelligence",
      "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml",
      "https://venturebeat.com/category/ai/feed/"
    ];

    worldBtn.addEventListener("click", function () {
      updateBrief("world");
    });

    aiBtn.addEventListener("click", function () {
      updateBrief("ai");
    });

    async function updateBrief(type) {
      worldBtn.disabled = true;
      aiBtn.disabled = true;
      summaryBox.textContent = "";

      if (type === "ai") {
        statusBox.textContent = "Getting latest AI news...";
      } else {
        statusBox.textContent = "Getting UK and world news...";
      }

      try {
        const feeds = type === "ai" ? AI_FEEDS : WORLD_FEEDS;
        const stories = await loadStories(feeds);

        if (!stories.length) {
          throw new Error("No stories loaded");
        }

        if (type === "ai") {
          summaryBox.textContent = buildAISummary(stories);
        } else {
          summaryBox.textContent = buildWorldSummary(stories);
        }

        statusBox.textContent = "Updated: " + new Date().toLocaleString("en-GB");
      } catch (error) {
        summaryBox.textContent = "Sorry, the news could not load. This is usually because the free RSS feed or proxy is blocked. Try again later.";
        statusBox.textContent = "Update failed.";
      }

      worldBtn.disabled = false;
      aiBtn.disabled = false;
    }

    async function loadStories(feeds) {
      let stories = [];

      for (const feed of feeds) {
        try {
          const response = await fetch(RSS_PROXY + encodeURIComponent(feed));
          const data = await response.json();

          if (data.items && Array.isArray(data.items)) {
            const items = data.items.slice(0, 5).map(function (item) {
              return {
                title: cleanText(item.title),
                text: cleanText(item.description || item.content || "")
              };
            });

            stories = stories.concat(items);
          }
        } catch (error) {
          // Carry on if one feed fails.
        }
      }

      return removeDuplicates(stories).slice(0, 10);
    }

    function buildWorldSummary(stories) {
      const ukWords = /uk|britain|british|england|scotland|wales|london|westminster|starmer|labour|conservative|nhs|government/i;

      const ukStories = stories.filter(function (story) {
        return ukWords.test(story.title + " " + story.text);
      });

      const worldStories = stories.filter(function (story) {
        return !ukWords.test(story.title + " " + story.text);
      });

      let picked = ukStories.slice(0, 3).concat(worldStories.slice(0, 4));

      if (!picked.length) {
        picked = stories.slice(0, 6);
      }

      let output = "Here’s a quick roundup of the main UK and world stories today:\n\n";

      picked.slice(0, 6).forEach(function (story) {
        output += makeParagraph(story) + "\n\n";
      });

      return output.trim();
    }

    function buildAISummary(stories) {
      let output = "Here’s a quick roundup of the latest AI and technology news today:\n\n";

      stories.slice(0, 6).forEach(function (story) {
        output += makeParagraph(story) + "\n\n";
      });

      return output.trim();
    }

    function makeParagraph(story) {
      let text = story.text || story.title || "";
      let title = story.title || "News update";

      text = text.replace(/Read more.*$/i, "").trim();
      text = text.replace(/Continue reading.*$/i, "").trim();

      if (text.length < 50) {
        return title + ".";
      }

      if (text.length > 230) {
        text = text.slice(0, 230);
        text = text.replace(/\s+\S*$/, "");
        text = text + ".";
      }

      return title + ". " + text;
    }

    function cleanText(html) {
      const div = document.createElement("div");
      div.innerHTML = html || "";

      return (div.textContent || div.innerText || "")
        .replace(/\s+/g, " ")
        .replace(/&nbsp;/g, " ")
        .trim();
    }

    function removeDuplicates(items) {
      const seen = new Set();

      return items.filter(function (item) {
        const key = (item.title || "")
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 70);

        if (!key || seen.has(key)) {
          return false;
        }

        seen.add(key);
        return true;
      });
    }
  </script>
</body>
</html>
