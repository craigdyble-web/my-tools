<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routine</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  padding: 20px;
}
h1 { text-align:center; }

.card {
  background:#1c1c1e;
  padding:20px;
  border-radius:16px;
}

button {
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#2ecc71;
  color:white;
  font-size:16px;
}

.popup {
  position: fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#1c1c1e;
  padding:20px;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  display:none;
}

.close {
  background:#e74c3c;
}
</style>
</head>

<body>

<h1>My Routine</h1>

<div class="card" id="app"></div>

<div class="popup" id="popup">
  <h3 id="title"></h3>
  <p id="info"></p>
  <button class="close" onclick="closePopup()">Close</button>
</div>

<script>

// 🧠 PRODUCT GUIDE
const info = {

"Cleanser":
"🧼 CeraVe Foaming Cleanser<br><br><b>How:</b> Wet face, massage 30–60 sec, rinse<br><b>When:</b> Morning + Night",

"Moisturiser":
"💧 CeraVe Moisturising Lotion<br><br><b>How:</b> Apply after all products<br><b>When:</b> Morning + Night",

"SPF":
"☀️ L'Oréal SPF 50<br><br><b>How:</b> Apply last step in morning<br><b>When:</b> Every morning<br>⚠️ Essential if using retinol",

"Vitamin C":
"🍊 Vitamin C Serum<br><br><b>How:</b> Pea-sized on dry skin<br><b>When:</b> Morning<br>⚠️ Can tingle (normal)",

"Retinol":
"🌙 CeraVe Retinol Serum<br><br><b>How:</b> Pea-sized on dry skin<br><b>When:</b> Night (2–3x week)<br>⚠️ Do NOT mix with exfoliant",

"Tan":
"🌞 Bondi Sands Gradual Tan<br><br><b>How:</b> Small amount, blend evenly<br><b>When:</b> Night (2–3x week)<br>⚠️ Wash hands after",

"Exfoliate":
"🧪 BHA Exfoliant<br><br><b>How:</b> Apply, leave on<br><b>When:</b> 1–2x week at night<br>⚠️ Do NOT mix with retinol"
};

// 📅 SIMPLE DAILY ROUTINE
const day = "Today";

const am = ["Cleanser","Vitamin C","Moisturiser","SPF"];
const pm = ["Cleanser","Retinol","Moisturiser"];

// 📲 RENDER
const app = document.getElementById("app");

function create(section, items){
  let html = `<h3>${section}</h3>`;
  items.forEach(i => {
    html += `<button onclick="openPopup('${i}')">${i}</button>`;
  });
  return html;
}

app.innerHTML = `
<h2>${day}</h2>
${create("AM", am)}
${create("PM", pm)}
`;

// 📱 POPUP
function openPopup(item){
  document.getElementById("title").innerText = item;
  document.getElementById("info").innerHTML = info[item];
  document.getElementById("popup").style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}

</script>

</body>
</html>
