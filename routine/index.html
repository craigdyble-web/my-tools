<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routine</title>

<style>
body {
  font-family: Arial;
  background: #0f0f0f;
  color: white;
  padding: 20px;
}
h1 { text-align:center; }

.card {
  background:#1c1c1e;
  padding:20px;
  border-radius:16px;
}
button {
  width:100%;
  padding:14px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  background:#2ecc71;
  color:white;
}
</style>
</head>

<body>

<h1>My Routine</h1>

<div class="card" id="app"></div>

<script>
const day = "Today";

const am = ["Cleanser","Moisturiser","SPF"];
const pm = ["Cleanser","Retinol","Moisturiser"];

const app = document.getElementById("app");

let html = "<h2>" + day + "</h2>";
html += "<h3>AM</h3>";
am.forEach(i => html += "<button>" + i + "</button>");
html += "<h3>PM</h3>";
pm.forEach(i => html += "<button>" + i + "</button>");

app.innerHTML = html;
</script>

</body>
</html>
